<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LDH My Best 6</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mouse+Memoirs&display=swap" rel="stylesheet">
</head>

<body>

  <div class="bg_pt"></div>

  <main>

    <div id="startScreen">
  <h1>LDH My Best 6</h1>
  <p>106人の中から好きな人を選びます</p>

  <button id="startButton">START</button>
  <button id="testRound2Button">第2ラウンドをテスト</button>
  
</div>


    <section id="sortScreen" hidden>

      <h2>ROUND1</h2>
      <p>20人に絞ります</p>
      <button id="backButton">← BACK</button>
      <p id="progress"></p>

      <div id="cardArea">

        <div id="nextCard" class="memberCard">
         <img id="nextMemberImage" src="" alt="">
         <h2 id="nextMemberName"></h2>
         <p id="nextMemberGroup"></p>
        </div>

        <div id="memberCard" class="memberCard">
         <img id="memberImage" src="" alt="">
         <h2 id="memberName"></h2>
         <p id="memberGroup"></p>
        </div>

      </div>

    </section>


    <section id="round2Intro" hidden>
      <h2>ROUND2</h2>
      <p id="round2IntroText"></p>

      <button id="round2StartButton">
        START
      </button>

    </section>


    <section id="round2Screen" hidden>
      <h2>ROUND2</h2>
      <p id="round2Progress"></p>
      
      <div id="round2Area">
      </div>

      <button id="round2ConfirmButton">
        ENTER
      </button>

    </section>


    <section id="finalScreen" hidden>
      <h2 id="finalTitle"></h2>
      <p id="finalProgress"></p>
      <div id="finalArea">
      </div>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
