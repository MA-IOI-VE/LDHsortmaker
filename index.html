<!DOCTYPE html>
<html lang="ja">
<head>

</head>

<body>

  <main>

<p>106人の中から好きな人を選んでください。</p>

 <div id="cardArea">

    <img id="memberImage" src="" alt="">
    <h2 id="memberName"></h2>

  </div>
</div>
</section>

<section id="round2Intro" hidden>
  <h2>第2ラウンド</h2>

  <p id="round2IntroText"></p>

  <button id="round2StartButton">
    第2ラウンドを始める
  </button>
</section>
  </main>

  <script src="script.js"></script>
</body>
</html>
