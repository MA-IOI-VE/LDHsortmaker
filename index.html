<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LDH My Best 6</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mouse+Memoirs&display=swap" rel="stylesheet">
</head>

<body>

  <div class="bg_pt"></div>

  <main>

    <div id="startScreen">
  <h1>LDH My Best 6</h1>
  <p>106人の中から6人を選びましょう！</p>

  <button id="startButton">START</button>
  <button id="testRound2Button">第2ラウンドをテスト</button>
  
</div>


    <section id="sortScreen" hidden>

      <h2>ROUND1</h2>
      <p>直感で操作してください</p>
      <button id="backButton">← BACK</button>
      <p id="progress"></p>

      <div id="cardArea">

        <div id="nextCard" class="memberCard">
         <img id="nextMemberImage" src="" alt="">
         <h2 id="nextMemberName"></h2>
         <p id="nextMemberGroup"></p>
        </div>

        <div id="memberCard" class="memberCard">
         <img id="memberImage" src="" alt="">
         <h2 id="memberName"></h2>
         <p id="memberGroup"></p>
        </div>

      </div> 

    </section>


    <section id="round2Intro" hidden>
      <h2>予選</h2>
      <p id="round2IntroText"></p>
      <button id="round2StartButton">START</button>
    </section>


    <section id="round2Screen" hidden>
      <h2>予選</h2>
      <p id="round2Progress"></p>
      <div id="round2Area"></div>
      <button id="round2ConfirmButton">ENTER</button>
    </section>


    <section id="finalIntro" hidden>
      <h2>第2ラウンド</h2>
      <p id="finalIntroText"></p>
      <button id="finalStartButton">START</button>
    </section>

    <section id="finalBattleIntro" hidden>
      <h2>最終決戦</h2>
      <p id="finalBattleIntroText"></p>
      <button id="finalBattleStartButton">START</button>
    </section>

    <section id="finalScreen" hidden>
      <h2 id="finalTitle"></h2>
      <p id="finalProgress"></p>
      <div id="finalArea">
      </div>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
